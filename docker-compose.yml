# Build a native, self-contained application into ./dist/<platform>:
#
#   docker compose up linux     # dist/linux/RealTimeFluid-<arch>.AppImage
#   docker compose up windows   # dist/windows/RealTimeFluid/RealTimeFluid.exe
#   docker compose up macos     # dist/macos/RealTimeFluid.app (run on a Mac)
#
# `docker compose up` without a service builds Linux and Windows.

services:
  linux:
    build:
      context: .
      target: linux
    # Always rebuild, Docker's layer cache keeps unchanged builds fast
    pull_policy: build
    volumes:
      - ./dist/linux:/dist

  windows:
    build:
      context: .
      target: windows
    pull_policy: build
    volumes:
      - ./dist/windows:/dist

  macos:
    # Needs the macOS SDK from the Xcode Command Line Tools
    # (`xcode-select --install`), so it is only built on request.
    profiles: [macos]
    build:
      context: .
      target: macos
      additional_contexts:
        macos-sdk: ${MACOS_SDK:-/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk}
    pull_policy: build
    volumes:
      - ./dist/macos:/dist
